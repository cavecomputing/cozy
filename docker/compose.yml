services:
  cozypub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ../data:/data
    restart: unless-stopped
    environment:
      # Optional: put COZY_PASSWORD='…' in docker/.env to require a password.
      # Left unset, Cozy has no sign-in. See docs/7-security.md.
      - COZY_PASSWORD=${COZY_PASSWORD:-}
