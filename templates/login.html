<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Sign in · Cozy</title>
    <link id="theme-stylesheet" rel="stylesheet" href="/themes/cozy.css">
    <script>
        // The theme this device last chose in the app, before the first paint,
        // as in index.html. One that has since gone falls back to the default,
        // keeping a light theme light, as loadThemeList() does in the app.
        try {
            var savedTheme = JSON.parse(localStorage.getItem('cozy/prefs') || '{}').theme;
            if (savedTheme) {
                var themeLink = document.getElementById('theme-stylesheet');
                themeLink.onerror = function () {
                    themeLink.onerror = null;
                    themeLink.href = String(savedTheme).endsWith('-light') ? '/themes/cozy-light.css' : '/themes/cozy.css';
                };
                themeLink.href = '/themes/' + encodeURIComponent(savedTheme) + '.css';
            }
        } catch (e) { /* private mode, blocked storage, unparseable prefs */ }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" media="(max-width: 768px), (max-height: 500px) and (hover: none)" href="{{ url_for('static', filename='css/mobile.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <meta name="theme-color" content="#0a141f">
</head>
<body class="signin">
    <form class="signin-card" method="post">
        <img class="signin-logo" src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="96" height="96">
        <h1 class="signin-wordmark">cozy</h1>
        <div class="signin-field">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
            <button class="signin-submit" type="submit" title="Sign in" aria-label="Sign in">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <p class="signin-error" role="alert">{{ error or '' }}</p>
        <label class="signin-remember"><input type="checkbox" name="remember" checked> Keep this device signed in</label>
    </form>
    <script>
        // The browser bar and an installed app's status bar match the page, as
        // syncThemeColor() keeps them in the app.
        function syncThemeColor() {
            document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).backgroundColor;
        }
        document.getElementById('theme-stylesheet').addEventListener('load', syncThemeColor);
        syncThemeColor();
    </script>
</body>
</html>
