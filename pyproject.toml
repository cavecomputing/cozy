[project]
name = "cozy"
version = "0.0.0" # Packaging placeholder; running builds use their Git commit.
description = "A single-user Flask web app for chatting with LLM character cards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1"
]

[tool.uv]
package = false
