[project]
name = "cozy"
version = "1.1.0"
description = "A single-user Flask web app for chatting with LLM character cards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=25.3.0",
    "pillow>=11.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2"
]

[tool.uv]
package = false
